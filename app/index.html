<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>html, body { margin: 0; background: #0b0b10; }</style>
</head>
<body>
<script>
// TizenBrew serves this page through jsDelivr, whose branch cache can lag for days,
// so this page stays a fixed loader and the app comes from GitHub Pages (~10 min after a push).
(function () {
  var local = location.hostname === 'localhost';
  var base = local ? '' : 'https://roman12ok.github.io/tv-home/app/';
  var bust = local ? '' : '?v=' + Math.floor(Date.now() / 6e5);

  function load(tag, attr, url, fallback, done) {
    var el = document.createElement(tag);
    if (tag === 'link') el.rel = 'stylesheet';
    el.onload = done;
    el.onerror = function () {
      if (url === fallback) return done();
      load(tag, attr, fallback, fallback, done);
    };
    el[attr] = url;
    (tag === 'link' ? document.head : document.body).appendChild(el);
  }

  // app.js measures the glass panels on start, so it waits for the stylesheet
  load('link', 'href', base + 'style.css' + bust, 'style.css', function () {
    load('script', 'src', base + 'app.js' + bust, 'app.js', function () {});
  });
})();
</script>
</body>
</html>
